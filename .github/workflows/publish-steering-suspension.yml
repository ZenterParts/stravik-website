# Publishes the steering and suspension catalogue from the Master Data database (Supabase) to the website.
# Source: tables stravik_ss_* through the public function stravik_ss_catalogue() (no prices, no internal fields).
# - every hour: publishes only if the catalogue in the database changed
# - by hand: Actions > Publish steering and suspension catalogue > Run workflow
name: Publish steering and suspension catalogue

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-steering-suspension.yml']

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-steering-suspension
  cancel-in-progress: false

env:
  SUPABASE_URL: https://kyegujgvlsbttyrlibgn.supabase.co
  # Publishable key: safe in public code, it can only call the public catalogue function.
  SUPABASE_KEY: sb_publishable_tDldHk_KiFLeR7kOPzJKJg_IKmYLcwX
  FILE: steering-suspension.json

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read the catalogue from Supabase
        id: read
        run: |
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/stravik_ss_catalogue" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}' -o "$RUNNER_TEMP/new.json"
          N=$(jq '.parts | length' "$RUNNER_TEMP/new.json")
          echo "Parts in the database: $N"
          # safety: never publish an empty or badly shrunk catalogue
          OLD=$( [ -f "$FILE" ] && jq '.parts | length' "$FILE" || echo 0 )
          if [ "$N" -lt 100 ] || [ "$N" -lt $(( OLD * 8 / 10 )) ]; then echo "::error::Only $N parts (was $OLD). Not publishing."; exit 1; fi
          jq -cS 'del(.at)' "$RUNNER_TEMP/new.json" > "$RUNNER_TEMP/new.cmp"
          if [ -f "$FILE" ]; then jq -cS 'del(.at)' "$FILE" > "$RUNNER_TEMP/old.cmp"; else : > "$RUNNER_TEMP/old.cmp"; fi
          if cmp -s "$RUNNER_TEMP/new.cmp" "$RUNNER_TEMP/old.cmp"; then
            echo "No changes in the database."; echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            jq -c . "$RUNNER_TEMP/new.json" > "$FILE"; echo "changed=yes" >> "$GITHUB_OUTPUT"; echo "parts=$N" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and publish
        if: steps.read.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Stravik catalogue publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -q -m "Publish steering and suspension catalogue from database (${{ steps.read.outputs.parts }} parts)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build will start from the push"
