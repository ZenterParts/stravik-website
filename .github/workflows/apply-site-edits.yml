# Applies site edits sent as small scripts to .github/site-edits/ (used for files too large to send whole, such as
# assets/app.js and tools/build-pages.js), then rebuilds the part pages and publishes, as the catalogue publisher does.
# Each script changes exact pieces of text and stops with an error if any of them is not found exactly once, so a script
# that no longer fits the files changes nothing. A script that ran is deleted in the same commit as its changes.
# If a run fails, the script stays in .github/site-edits/ and nothing on the site changes.
name: Apply site edits

on:
  push:
    branches: [main]
    paths: ['.github/site-edits/*.js']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-edits
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the edit scripts and rebuild the pages
        id: edit
        run: |
          shopt -s nullglob
          E=(.github/site-edits/*.js)
          if [ ${#E[@]} -eq 0 ]; then echo "Nothing to apply"; echo "done=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          for f in "${E[@]}"; do echo "== $f"; node "$f"; git rm -q "$f"; done
          node tools/build-pages.js
          git config user.name "Stravik site edits"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Apply site edits: $(for f in "${E[@]}"; do basename "$f" .js; done | paste -sd' ')"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          echo "done=yes" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.edit.outputs.done == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages build will start from the push"
